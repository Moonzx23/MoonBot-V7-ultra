function normalize(text){

 return text
 .toLowerCase()
 .replace(/[!?.,;:]+/g," ")
 .replace(/\bnk\b/g,"nak")
 .replace(/\btk\b/g,"tak")
 .replace(/\btakde\b/g,"tak ada")
 .replace(/\btkde\b/g,"tak ada")
 .replace(/\bxde\b/g,"tak ada")

 .replace(/\borg\b/g,"orang")
 .replace(/\bkwn\b/g,"kawan")
 .replace(/\bklu\b/g,"kalau")
 .replace(/\bmcm\b/g,"macam")
 .replace(/\bape\b/g,"apa")
 .replace(/\bsape\b/g,"siapa")
 .replace(/\bcamne\b/g,"macam mana")
 .replace(/\bbg\b/g,"bagi")
 .replace(/\bbgi\b/g,"bagi")
 .replace(/\bblh\b/g,"boleh")
 .replace(/\btakleh\b/g,"tak boleh")
 .replace(/\bxleh\b/g,"tak boleh")
 .replace(/\bskrg\b/g,"sekarang")
 .replace(/\bsbb\b/g,"sebab")
 .replace(/\bmkn\b/g,"makan")
 .replace(/\btgh\b/g,"tengah")
 .replace(/\bdkt\b/g,"dekat")
 .replace(/\bnkbuat\b/g,"nak buat");

}

/* =========================================================

   ========================================================= */

function calculateMath(q){

 let expression=q
 .replace(/berapa|kira|jawab|sama dengan/g,"")
 .replace(/darab/g,"*")
 .replace(/tambah/g,"+")
 .replace(/tolak/g,"-")
 .replace(/bahagi/g,"/")
 .replace(/×/g,"*")
 .replace(/÷/g,"/")
 .replace(/x/g,"*")
 .trim();

 const percent=
 expression.match(/(\d+(?:\.\d+)?)\s*%\s*(?:daripada|of)\s*(\d+(?:\.\d+)?)/);

 if(percent){

   const a=Number(percent[1]);
   const b=Number(percent[2]);

   return String((a/100)*b);

 }

 const ratio=
 expression.match(/(\d+(?:\.\d+)?)\s+daripada\s+(\d+(?:\.\d+)?)/);

 if(ratio){

   const a=Number(ratio[1]);
   const b=Number(ratio[2]);

   return ((a/b)*100).toFixed(2)+"%";

 }

 if(!/^[0-9+\-*/().%\s]+$/.test(expression))
 return null;

 try{

   if(!/[+\-*/]/.test(expression))
   return null;

   const result=Function('"use strict";return ('+expression+')')();

   if(Number.isFinite(result))
   return String(result);

 }catch(e){}

 return null;

}

function getAnswer(original){

 const q=normalize(original);

 if(!q) return "Taip sesuatu dulu bro 😎";

 const greet=greeting(q);
 if(greet)return greet;

 const creator=creatorKnowledge(q);
 if(creator)return creator;

 const fact=generalFacts(q);
 if(fact)return fact;

 const math=calculateMath(q);

 if(math!==null)
 return "🧮 Jawapan: "+math;

 if(q.includes("mode"))
 return modeReply();

 for(const key in knowledge){

   const item=knowledge[key];

   for(const word of item.keywords){

     if(q.includes(word))
     return item.answer;

   }
 }

 if(
  q.includes("siapa kau") ||
  q.includes("apa itu moonbot") ||
  q.includes("kau siapa")
 )
 return "Aku MoonBot V7 Ultra 🌙, chatbot web yang dibangunkan sebagai projek Nazreel pada tahun 2026.";

 if(

  q.includes("bijak")
 )
 return "Aku direka dengan knowledge base, normalizer Bahasa Melayu, math engine, topic engine dan conversation engine. Tapi aku masih bukan model AI cloud sebenar.";

 if(

 )

 if(

 if(

}
